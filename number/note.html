    .sort select{padding:5px 6px}

</style>

]}}, {"raw": "【调研分享】上古王冠研究报告.docx", "title": "上古王冠", "slug": "调研分享上古王冠研究报告docx", "category": "调研分享", "file": "【调研分享】上古王冠研究报告.docx", "size_bytes": 6171896, "size_human": "5.9 MB", "ext": "docx", "mdate": "2022-03", "chars": 2171, "cjk": 1705, "images": 18, "headings": ["上古王冠", "游戏概述", "1.1.产品信息", "1.2.体验账号", "1.3.游戏主要界面", "基本玩法", "2.1. 日常玩法和游戏时长", "2.2.新手带入和新手时长", "战斗系统", "3.1.战斗呈现", "3.2.战斗要素", "后续内容："], "paras": 136, "ov": {"focus": "战斗结构 · 轻量放置", "tagline": "日均 40–60 分钟的轻量竖版放置 RPG，胜负与出手顺序都有明确的数值判定。", "points": [["战斗流程", "最多 5 人布阵、按速度值依次出手，同速时战力高者优先；全自动。胜负除全灭外，还有「限时结束时总生命高于敌方」这一条。"], ["策略层级", "站位权重最高——6 种阵型本身无属性加成，但技能多为「打一排／一列」；元素克制仅 +20% 伤害（报告载述），报告判断其影响远小于技能差距。"], ["设计取向", "同等级英雄之间数值差异很小，战斗变化主要靠状态（增益／减益）差异化来制造。"], ["服务器结构", "官服 iOS 与安卓可同服、但账号数据不互通（苹果分成机制所致）；渠道服与官服不互跨，开服节奏为每天 6 服。"]]}}, {"raw": "【调研分享】古代战争：放置救世主调研报告.docx", "title": "古代战争：放置救世主", "slug": "调研分享古代战争：放置救世主调研报告docx", "category": "调研分享", "file": "【调研分享】古代战争：放置救世主调研报告.docx", "size_bytes": 14618567, "size_human": "13.9 MB", "ext": "docx", "mdate": "2022-03", "chars": 3138, "cjk": 2492, "images": 33, "headings": ["古代战争：放置救世主", "1游戏概述", "1.1产品信息", "1.2体验帐号", "2核心玩法", "2.1游戏介绍", "2.2 游戏时长", "3战斗系统", "4游戏玩法", "4.1   无尽炼狱", "4.2   每日副本", "4.3   游戏探索", "4.4   图鉴馆", "4.5   世界BOSS", "4.6   模拟战", "4.7   其它系统", "5社交系统", "后续内容："], "paras": 118, "ov": {"focus": "反卡点 · 社交即主体", "tagline": "以「零门槛＋强社交」为卖点的小众放置，几处设计刻意与主流做法反着来。", "points": [["睡觉变强", "离线收益只比在线低 10%；每日 0 点当前关卡怪物属性 −5%、最多累计 −30%（报告载述），前中期几乎不存在硬卡点。"], ["抽卡保底", "初始 SSS 概率 1%，每次未中 +6%，多数玩家第 5–6 次出货（报告载述）；无 VIP、无密集氪金活动，所有资源均开放获取与合成。"], ["反滚服", "血战按每 20 级分赛区，老区还有更高世界 BOSS 奖励与经验加成，报告观察到不冲榜的玩家反而更愿意留在老区。"], ["社交即主体", "聊天窗口占屏一半、任意界面可切全屏；用注册方式限制加「小黑屋」（违规者发言仅自己可见）替代封号，频道几乎无广告。"], ["战斗", "6 人上阵、速度定序、10 回合上限、竖版全自动，配合 12 小时离线经验构成主要成长来源。"]]}}, {"raw": "【调研分享】叫我大掌柜 台服调研报告.docx", "title": "叫我大掌柜 台服", "slug": "调研分享叫我大掌柜台服调研报告docx", "category": "调研分享", "file": "【调研分享】叫我大掌柜 台服调研报告.docx", "size_bytes": 14214940, "size_human": "13.6 MB", "ext": "docx", "mdate": "2022-03", "chars": 4309, "cjk": 3355, "images": 55, "headings": ["【调研分享】叫我大掌柜 台服调研报告", "游戏概述", "1.1产品信息", "1.2游戏总述", "游戏美术风格", "2.1场景", "2.2角色", "游戏玩法", "3.1商铺经营", "3.2主线关卡", "3.3游历", "后续内容："], "paras": 218, "ov": {"focus": "单指标数值 · 点击驱动", "tagline": "把全部玩法收敛到单一「赚速」数值的点击式经营，主动取消策略性。", "points": [["去策略", "取消统一体力设定，改为各玩法独立次数限制；所有玩法都推动同一指标「赚速」（即战力），玩家不必再思考资源分配。"], ["目标切分", "极长养成线被拆到个位数级的阶段目标，光完成日常就能连破数关，降低「被卡战力」的感知、抬升平民留存。"], ["核心交互", "主要玩法是连续点击（报告类比斯金纳箱）；一大付费点正是「把几百次点击压缩成一键领取」的快感。"], ["建筑循环", "获取资源→升级建筑→提高每秒银两；医馆、客栈、钱庄各带独立小玩法（接诊流程、五菜系炒菜、3×5 柜台四类产值）。"], ["主线与游历", "主线靠贸易点击推进，9 次点击一循环、银两消耗递增，BOSS 战只比门客总战力；游历按地点触发好感度、赌博、品酒等事件，撑起收集线。"]]}}, {"raw": "【调研分享】坎公骑冠剑 研究报告.docx", "title": "坎公骑冠剑", "slug": "调研分享坎公骑冠剑研究报告docx", "category": "调研分享", "file": "【调研分享】坎公骑冠剑 研究报告.docx", "size_bytes": 25456524, "size_human": "24.3 MB", "ext": "docx", "mdate": "2022-03", "chars": 5082, "cjk": 4090, "images": 41, "headings": ["【调研分享】坎公骑冠剑 研究报告", "游戏概述", "1.1产品信息", "1.2排行榜情况：", "体验玩法", "1.1日常玩法与游戏时长", "1.2新手带入和新手时长", "1.3游戏目标", "包装", "1.1文案剧情", "1.2美术风格", "战斗系统", "1.1战斗流程", "1.2战斗元素", "后续内容："], "paras": 204, "ov": {"focus": "战斗设计 · 包装逻辑", "tagline": "用「梗文化＋像素召唤结构」撑起老套冒险框架的 2D 像素解谜 RPG。", "points": [["战斗结构", "4 人小队但只操控队长，其余 3 人为 AI 且不能释放武器技能；全武器自动锁敌，近战攻击会自动向目标拉近身位。"], ["属性数值", "克制造成 130%、被克 70%、无关 100%，装备与英雄同属性额外 +10% 属性攻击（报告载述）；攻击属性随武器走、防御属性随英雄走。"], ["组合技链", "武器技能造成重伤／击倒／击飞异常，异常值满后可接力触发连锁技能，内置 20 秒 CD；重伤使目标 2.5 秒失控且无视免疫盾。"], ["包装逻辑", "像素的抽象性带来「召唤结构」，为剧本埋梗（龙珠、JOJO、逆转裁判等）留出空间；情绪靠夸张表情、镜头推拉与 BGM 放大。"], ["市场表现", "国服上线 7 天全平台流水约 1.3 亿；海外除中国累计约 14 亿、下载 700 万，Google Play 34.9 万评价 4.68 分（报告载述）。"]]}}, {"raw": "【调研分享】天地劫研究报告.docx", "title": "天地劫", "slug": "调研分享天地劫研究报告docx", "category": "调研分享", "file": "【调研分享】天地劫研究报告.docx", "size_bytes": 25259499, "size_human": "24.1 MB", "ext": "docx", "mdate": "2022-03", "chars": 7425, "cjk": 6279, "images": 44, "headings": ["【调研分享】天地劫研究报告", "游戏概述", "1.1.产品信息", "1.2.账号体验", "体验玩法", "2.1.日常玩法和游戏时长", "2.2.新手带入和新手时长", "2.3.游戏目标", "IP与包装", "3.1.IP与剧情", "3.2.美术画风", "3.3.UI&UE", "战斗系统", "4.1.战斗流程", "4.2.战斗要素", "4.3.战斗表现", "后续内容："], "paras": 213, "ov": {"focus": "战棋地形 · 品质升级", "tagline": "继承《梦幻模拟战》骨架、以 3D 场景与全语音叙事做品质升级的 SRPG 战棋。", "points": [["机制承袭", "冰／火／雷三角对应梦战骑／步／枪，弓克飞、光克暗同样复刻；克制效果为自身攻击 +30%、敌方攻击 −25%（报告载述）。"], ["职业分工", "铁卫／侠客／御风／羽士／咒师／祝由六职业；羽士只能打 2 格（1 格敌人无法反击），咒师与祝由近身攻击会触发敌方「先攻」。"], ["地形即玩法", "栅栏物免、篝火暴击、毒气每回合 −10% 气血、真炎 −24% 气血、霜冻移动 −1、雷场被暴击率 +20%；部分奖励需飞行／轻功单位跨地形才能取到。"], ["BUFF 规则", "不同类别增益无上限可叠加，同类增益采用覆盖制取最大值（报告载述）。"], ["口碑与风险", "TapTap 由内测 9.2 跌至公测 6.8，好评集中在 IP／画面／音效、差评集中在抽卡与运营；报告点出「自动战斗 AI 弱」与「优质演出被养成进度逼着跳过」的结构矛盾。"]]}}, {"raw": "【调研分享】守望黎明研究报告.docx", "title": "守望黎明", "slug": "调研分享守望黎明研究报告docx", "category": "调研分享", "file": "【调研分享】守望黎明研究报告.docx", "size_bytes": 6024170, "size_human": "5.7 MB", "ext": "docx", "mdate": "2022-03", "chars": 5845, "cjk": 4639, "images": 33, "headings": ["守望黎明", "游戏概述", "1.1.   产品信息", "1.2.   体验账号", "战斗系统详解", "2.1.   编队详解", "2.2.   行军速度大致解析", "2.3.   集结规则", "2.4.   士兵数量无限", "2.5.   编队的战斗规则", "2.6.   一些战斗规则", "2.7.   兵力消耗类型", "2.8.   守城战斗", "2.9.   兵多有用吗？", "2.10.      城墙耐久和破坏值的关系", "2.11.      侦查", "2.12.      战争守护", "2.13.      战报", "2.14.      资源掠夺", "后续内容："], "paras": 210, "ov": {"focus": "战斗公式 · 战报级拆解", "tagline": "把 SLG 战斗拆到「编队—距离—损耗」层层可算的末日题材产品，几乎全篇是规则量化。", "points": [["地图量化", "地图 1200×1200 格、每格 1 公里，一城占 2×2 格；编队行军速度取最慢小队，速度 30 的 7 级改装车每公里约 1.5 秒（报告载述）。"], ["编队战斗", "前／中／后排距离分别为 1／3／5，技能只在有效距离内生效；8 回合定胜负，进攻方未胜即判负；兵力消耗＝被打掉血量的一半。"], ["损耗三态", "轻伤回城即愈、重伤进帐篷需资源治疗、死亡不可逆；攻城方全部重伤直接转死亡，急救帐篷装不下的也直接死亡。"], ["集结与破城", "集结时间 5／10／30／60 分钟，且战斗结果出来前无法补兵；城墙耐久被打穿即「打飞」并强制随机迁城，落地恢复 500 点。"], ["反直觉结论", "可无限出兵，但空闲兵不参与守城；等级压制严重（T9 压 T8），中等玩家屯兵反而送人头。掠夺固定为编队 95% 负重四资源均分＋5% 负重金币。"]]}}, {"raw": "【调研分享】崩坏3rd研究报告.docx", "title": "崩坏3rd", "slug": "调研分享崩坏3rd研究报告docx", "category": "调研分享", "file": "【调研分享】崩坏3rd研究报告.docx", "size_bytes": 22117610, "size_human": "21.1 MB", "ext": "docx", "mdate": "2022-03", "chars": 9821, "cjk": 7887, "images": 67, "headings": ["崩坏3rd", "游戏概述", "1.1．产品信息", "1.2．体验账号说明", "游戏背景设定", "2.1.游戏背景", "2.2.关键词释义", "游戏玩法设计", "3.1.游戏新手引导", "3.2.日常玩法", "3.3.PVP向玩法", "3.4.多人联机玩法", "3.5.开放世界", "3.6.玩法总结", "商业化设计", "4.1. 付费系统", "4.2. 补给系统", "4.3. 付费系统分析", "4.4. 游戏运营", "后续内容"], "paras": 296, "ov": {"focus": "商业化三层 · 二次元运营", "tagline": "以「贩卖人设」为第二盈利轴的二次元动作手游，本份把商业化拆成三层并给足价格口径。", "points": [["盈利分层", "Pay to win（角色／武器／圣痕）、Pay to cool（服装／舰桥）、Pay to love（人设）；立绘、声优、剧情、PV、动画短片都服务于人设这一核心。"], ["保底体系", "扩充补给 100 抽必出当期 S 且次数可跨池继承；精准补给 10 抽保底 4 星、但武器与圣痕常无保底；扩充装备池 50 连必出 UP 且不重复，最非约 200 抽（5.6 万水）毕业。"], ["白嫖口径", "每月免费约 8000 水晶、月卡党约 1.1 万；水晶:RMB 约 10:1，月卡 30 元合计 3100 水（报告载述），据此推算三个版本可攒出一个 S。"], ["竞速型 PVP", "并无真 PVP：超弦空间按 20 人一组、4 关积分，用「天气效果」逼玩家培养多套阵容；扰动幅度会随全体通关时间动态上调难度。"], ["生态运营", "约 45 天一版本、几乎无长草期；生日礼物、女武神来电、给满级玩家寄实体零食礼包，长期经营粉丝关系。"]]}}, {"raw": "【调研分享】放置少女 初级研究报告.docx", "title": "放置少女", "slug": "调研分享放置少女初级研究报告docx", "category": "初级研究", "file": "【调研分享】放置少女 初级研究报告.docx", "size_bytes": 10494970, "size_human": "10.0 MB", "ext": "docx", "mdate": "2022-03", "chars": 4051, "cjk": 3061, "images": 46, "headings": ["【调研分享】放置少女 初级研究报告", "游戏概述", "产品信息", "战斗系统", "2.1战斗要素", "核心玩法", "3.1 日常玩法和游戏时长", "3.2 新手带入和新手时长", "3.3 挂机地图", "3.4 玩法", "后续内容："], "paras": 213, "ov": {"focus": "技能颗粒度 · 日本市场", "tagline": "三国娘化＋「超简单」放置，主战场在日本市场；报告把技能颗粒度拆得很细。", "points": [["战斗单位", "1 主将＋出阵副将＋应援副将（阵亡后每回合补 1 名）；上场数随等级解锁，90 级时出阵与应援合计 11 名。"], ["技能分类", "攻击技能按单体／群攻／连击／追加（会心、击杀、Debuff、血量阈值触发）／特殊索敌拆分；回复技能按对象数、次数、最小与最大倍率、会心倍率逐项定义。"], ["奥义", "由「持有特定副将组合」触发的被动加成，无需上场即可生效，多个奥义可叠加。"], ["极致轻量", "日常任务约 3–4 分钟、战斗全可跳过；放置收益受挂机时长、地图等级、加成副将与活动翻倍影响，仓库满后溢出装备自动转铜货。"], ["公会战分层", "倾国的战役（本服前 16 同盟）→ 群雄争霸（4 服 48 同盟分黄金／白银／青铜）→ 战姬无双 → 皇室的阴谋，逐级开放。"], ["市场", "2021 年 Q1 日本手游收入榜第 11、中国手游在日收入第 3（报告载述）。"]]}}, {"raw": "【调研分享】斗罗大陆-斗神再临研究报告.docx", "title": "斗罗大陆-斗神再临", "slug": "调研分享斗罗大陆斗神再临研究报告docx", "category": "调研分享", "file": "【调研分享】斗罗大陆-斗神再临研究报告.docx", "size_bytes": 25904842, "size_human": "24.7 MB", "ext": "docx", "mdate": "2022-03", "chars": 7366, "cjk": 5979, "images": 86, "headings": ["【调研分享】斗罗大陆-斗神再临研究报告", "游戏概述", "1.1产品信息", "1.2游戏速览", "战斗系统", "2.1战前准备", "2.2战斗机制", "2.3策略性分析", "游戏养成系统", "3.1战力构成总览", "3.2角色的收集和养成", "后续内容："], "paras": 255, "ov": {"focus": "魂环策略 · 战力构成", "tagline": "MMORPG 大地图＋卡牌战斗＋放置减负的混合体，策略核心落在「魂环」而非地图。", "points": [["战斗", "即时制但手动只能放技能、不能移动或选目标；武魂技每攻击 +1 能量、9 点可放，武魂真身需 100 点（放武魂技 +25、被击 +10）。"], ["魂环即宝石", "每 10 级开一槽、100 级共 10 槽，同名魂环只能装 1 个；技能由角色自带、魂环仅负责激活，故中期起只有能开满 10 槽的 SSR 值得培养。"], ["星级与增幅", "10 碎片升 1 星、每 6 星染色，升满需 37 张同名卡；金色 6 星给「魂环年限增幅」，如 1.3 万年魂环按 +30% 计为 1.69 万年（报告载述）。"], ["战力构成", "总战力＝上阵 5 人战力之和；报告点名装备强化数值占比过重，压低了魂环搭配本应有的策略价值。"], ["抽卡与重置", "普通池 SSR 10%、49 抽保底且提前出货不重置；主题池 99 抽必得当期角色。每抽到一个 SSR 送 1 个「月光宝盒」，可近乎无损重置，鼓励大胆试阵容。"]]}}, {"raw": "【调研分享】朕的江山研究报告.docx", "title": "朕的江山", "slug": "调研分享朕的江山研究报告docx", "category": "调研分享", "file": "【调研分享】朕的江山研究报告.docx", "size_bytes": 23737731, "size_human": "22.6 MB", "ext": "docx", "mdate": "2022-03", "chars": 7373, "cjk": 6397, "images": 64, "headings": ["朕的江山", "游戏概述", "1.1产品信息", "1.2体验账号", "基础设定", "2.1新手带入和新手时长", "2.2主界面", "核心玩法", "3.1战区资源", "3.2普通战（吃鸡玩法）", "3.3赛季模式", "3.4周末活动", "商业化", "后续内容"], "paras": 324, "ov": {"focus": "吃鸡化 SLG · 局内经济", "tagline": "把「吃鸡」赛制搬进三国 SLG，用单局 2–120 小时的对局替代长线养成服。", "points": [["局制", "8 人按官职匹配，一局 2–120 小时，游戏内 1 年＝1 小时，统一在公元 280 年结算；胜利条件为灭尽他方或占城最多。"], ["局内经济", "铜钱／粮草／兵力分离：兵力归城池所有、需运输到前线；民居／集市／农田共 10 个建筑位，产出本局全局共享。"], ["全自动战斗", "进场即自动、玩家只能观战；每回合普攻或怒气技，怒气靠命中累积，攻城战上限 100 回合，且无伤兵概念。"], ["时间与外交", "开局 2 小时保护期；夜间 0–9 点初始城免战、但打玩家城需 10 倍粮草；最多 2 人同盟，可结盟也可背刺。"], ["商业化联动", "普通／重金／限定三类卡池；限定招募令主要靠参与主题季活动获取，用付费点反向拉动玩法生态的活跃度。"]]}}, {"raw": "【调研分享】江南百景图调研报告.docx", "title": "江南百景图", "slug": "调研分享江南百景图调研报告docx", "category": "调研分享", "file": "【调研分享】江南百景图调研报告.docx", "size_bytes": 15616868, "size_human": "14.9 MB", "ext": "docx", "mdate": "2022-03", "chars": 2835, "cjk": 2302, "images": 45, "headings": ["江南百景图", "游戏概述", "1.1.产品信息", "1.2.体验账号", "1.3.游戏画面", "1.4.游戏目的（附带背景故事）", "居民养成", "2.1.稀有度", "2.2.属性", "2.3.能力", "2.4.等级", "2.5.珍宝", "2.6.居民进阶", "社交系统", "3.1.友情点互送", "3.2.土行孙", "商业化", "4.1.  氪金系统", "4.2.  礼包", "4.3.  看广告", "4.4.  月卡", "后续内容："], "paras": 153, "ov": {"focus": " const CAT_ORDER = ['深度研究','调研报告','初级研究','调研分享','其他'];
let curCat = '全部';
let curSort = 'default';
let curQuery = '';
let activeSlug = null;

function filtered(){
  let arr = DATA.filter(g=>{
    if(curCat!=='全部' && g.category!==curCat) return false;
    if(curQuery){
      const q = curQuery.toLowerCase();
      if(!(g.title.toLowerCase().includes(q) || g.raw.toLowerCase().includes(q))) return false;
    }
    return true;
  });
  if(curSort==='name') arr.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
  else if(curSort==='size') arr.sort((a,b)=>b.size_bytes-a.size_bytes);
  else if(curSort==='chars') arr.sort((a,b)=>b.chars-a.chars);
  else if(curSort==='date') arr.sort((a,b)=>String(b.mdate).localeCompare(String(a.mdate)));
  return arr;
}

function renderCatOptions(){
  const counts = {};
  DATA.forEach(g=>counts[g.category]=(counts[g.category]||0)+1);
  const cats = ['全部', ...CAT_ORDER.filter(c=>counts[c])];
  const sel = document.getElementById('cat');
  sel.innerHTML = cats.map(c=>{
    const n = c==='全部'?DATA.length:counts[c];
    return '<option value="'+esc(c)+'">'+esc(c)+'（'+n+'）</option>';
  }).join('');
  sel.value = curCat;
}

function renderList(arr){
  const list = document.getElementById('list');
  list.innerHTML='';
  if(arr.length===0){ list.innerHTML='<div class="empty">没有匹配的游戏</div>'; return; }
  arr.forEach(g=>{
    const d = document.createElement('div');
    d.className = 'item'+(g.slug===activeSlug?' on':'');
    d.innerHTML = '<div class="t">'+esc(g.title)+'</div>'+
      '<div class="m"><span class="badge cat">'+esc(g.category)+'</span></div>';
    d.onclick = ()=>{ activeSlug=g.slug; render(); };
    list.appendChild(d);
  });
}

function renderDetail(g){
  const wrap = document.getElementById('wrap');
  if(!g){ wrap.innerHTML='<div class="placeholder">← 从上方选择一份调研报告查看内容</div>'; return; }
  const ov = g.ov;
  const rows = ov.points.map(p =>
    '<div class="ov-row"><dt><span>'+esc(p[0])+'</span></dt><dd>'+esc(p[1])+'</dd></div>').join('');
  wrap.innerHTML =
    '<div class="detail">'+
      '<h2>'+esc(g.title)+'</h2>'+
      '<div class="hd-meta"><span class="badge cat">'+esc(g.category)+'</span>'+
        '<span class="badge focus">'+esc(ov.focus)+'</span>'+
        '<span class="badge date">资料时间 '+esc(g.mdate)+'</span></div>'+
      '<div class="sec">内容概览</div>'+
        '<div class="lead">'+esc(ov.tagline)+'</div>'+
        '<dl class="ov">'+rows+'</dl>'+
      '<div class="foot">口径说明：本页内容要点为对原报告的逐份提炼，其中数值、倍率、档位与运营数据均为<span>报告载述</span>，反映各报告调研时点（多为 2020–2021 年）的情况，未经独立复算，引用请以原件为准。<br>'+
        '标签「资料时间」取自源文件最后修改日期（合并条目取较晚者）；合集共 '+DATA.length+' 份。</div>'+
    '</div>';
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const arr = filtered();
  if(!activeSlug || !arr.some(g=>g.slug===activeSlug)){
    activeSlug = arr.length? arr[0].slug : null;
  }
  renderList(arr);
  renderDetail(arr.find(x=>x.slug===activeSlug) || null);
  document.getElementById('count').textContent = '共 '+DATA.length+' 份 · 当前显示 '+arr.length+' 份';
}

document.getElementById('cat').addEventListener('change', e=>{ curCat=e.target.value; activeSlug=null; render(); });
document.getElementById('search').addEventListener('input', e=>{ curQuery=e.target.value.trim(); activeSlug=null; render(); });
document.getElementById('sort').addEventListener('change', e=>{ curSort=e.target.value; activeSlug=null; render(); });
document.addEventListener('keydown', e=>{
  const arr = filtered();
  const idx = arr.findIndex(g=>g.slug===activeSlug);
  if(e.key==='ArrowDown' && idx<arr.length-1){ activeSlug=arr[idx+1].slug; render(); e.preventDefault(); }
  if(e.key==='ArrowUp' && idx>0){ activeSlug=arr[idx-1].slug; render(); e.preventDefault(); }
});

renderCatOptions();
render();
</script>
